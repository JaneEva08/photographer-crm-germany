services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photo_crm}
      POSTGRES_USER: ${POSTGRES_USER:-photo_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photo_crm} -d ${POSTGRES_DB:-photo_crm}"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://photo_crm:change-me-for-local-use@db:5432/photo_crm}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
  seed:
    build: .
    command: ["python", "-m", "backend.seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://photo_crm:change-me-for-local-use@db:5432/photo_crm}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["demo-data"]
volumes:
  postgres_data:
